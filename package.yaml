name: mini-haskell
version: 0.1.0.0
github: "instructr13/mini-haskell"
license: MIT
author: "Mido <mido@wycey.dev>"

extra-source-files:
  - README.md
  - lib/prelude.trst

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description: Please see the README on GitHub at <https://github.com/instructr13/mini-haskell#readme>

dependencies:
  - base >= 4.7 && < 5
  - containers
  - file-embed
  - optparse-applicative
  - parser-combinators
  - prettyprinter
  - megaparsec
  - mtl

ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints

library:
  source-dirs: src

executables:
  mini-haskell-exe:
    main: Main.hs
    source-dirs: app
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - mini-haskell

tests:
  mini-haskell-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - mini-haskell
      - hspec
    build-tools:
      - hspec-discover
