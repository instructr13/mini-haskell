cradle:
  multi:
    - path: "./examples"
      config:
        cradle:
          none:
    - path: "./Setup.hs"
      config:
        cradle:
          none:
    - path: "./"
      config:
        cradle:
          cabal:
            - path: "./app"
              component: "mini-haskell:exe:mini-haskell-exe"
            - path: "./src"
              component: "mini-haskell:lib:mini-haskell"
            - path: "./test"
              component: "mini-haskell:test:mini-haskell-test"
